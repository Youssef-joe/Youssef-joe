name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [github-metrics.svg]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Youssef-joe
          template: classic
          base: header, activity, community, repositories
          config_timezone: Africa/Cairo
          config_display: large

          # Languages: skip repos that have vendored virtualenvs committed
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_ignored: html, css, scss, jupyter notebook, cython, makefile, dockerfile, shell
          plugin_languages_skipped: saudi_arch_platform, fastAPI-

          # Open-source work only (private company repos have 0 stars)
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_repositories: yes
          plugin_notable_filter: stars:>5

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_skipped: saudi_arch_platform, fastAPI-

          filename: github-metrics.svg
          repositories: 50
          repositories_batch: 50
